name: Toegankelijkheid

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a11y:
    name: Toegankelijkheidspoort (WCAG 2.1 AA)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tools/a11y/package-lock.json

      # Zonder install-scripts downloadt puppeteer geen eigen browser; de poort
      # gebruikt de Chrome die al op de runner staat.
      - name: Install pa11y-ci
        working-directory: tools/a11y
        run: npm ci --ignore-scripts

      - name: Bouw de website en controleer elke pagina
        run: uv run --locked python scripts/check_a11y.py
