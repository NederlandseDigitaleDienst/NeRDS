name: Check for broken links and accessibility issues
on:
  # Run daily at 9:00 AM
  schedule:
    - cron: '0 9 * * *'
  # Run on PRs to main
  pull_request:
    branches: [ main ]
  # Allow manual triggering
  workflow_dispatch:

jobs:
  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Valideer plugin.json
        run: python3 -c "import json; json.load(open('.plugin/plugin.json'))"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      # Met uv, omdat het script het actieregister (YAML) leest.
      - name: Controleer plugin sync
        run: uv run --locked python scripts/generate_plugin.py --check

  check-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - name: Bouw de website en controleer tegen het designsysteem
        run: uv run --locked python scripts/check_site.py

  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Excluded URLs:
      # - rijksportaal.overheid-i.nl: Internal government portal
      # - rijkscloud.nl: Restricted API access
      # - bio-overheid.nl/ico-wizard: Returns 403 for automated checkers but works for users
      # - Sites blocking automated link checkers (415/connection refused):
      #   gebruikercentraal.nl, nldesignsystem.nl, gebruikersonderzoeken.nl,
      #   digitoegankelijk.nl, usmwiki.com, dutchcloudcommunity.nl
      # - Government sources (tweedekamer.nl, officielebekendmakingen.nl,
      #   rijksoverheid.nl, digitaleoverheid.nl, wetten.overheid.nl) are skipped
      #   here and checked in the next step, which tolerates a refused runner
      #   but still fails on a page that is gone.
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # Target specific files and improve the arguments
          args: >-
            --verbose
            --no-progress
            --exclude-loopback
            --exclude "file:///.*/issues.*"
            --exclude "file:///home/runner/work/.*"
            --exclude "https://rijksportaal.overheid-i.nl/.*"
            --exclude "https://rijkscloud.nl/.*"
            --exclude "https://bio-overheid.nl/ico-wizard"
            --exclude "https://dutchcloudcommunity\.nl/.*"
            --exclude "https://.*gebruikercentraal\.nl/.*"
            --exclude "https://.*nldesignsystem\.nl/.*"
            --exclude "https://gebruikersonderzoeken\.nl/.*"
            --exclude "https://kennisbank\.digitoegankelijk\.nl/.*"
            --exclude "https://usmwiki\.com/.*"
            --exclude "https://www\.digitaleoverheid\.nl/.*"
            --exclude "https://www\.rijksoverheid\.nl/.*"
            --exclude "https://wetten\.overheid\.nl/.*"
            --exclude "https://zoek\.officielebekendmakingen\.nl/.*"
            --exclude "https://www\.tweedekamer\.nl/.*"
            '**/*.yaml'
            '**/*.md'
            '**/*.ts'
            '**/*.vue'
          # Output file for creating issues
          output: ./lychee/out.md

      # These sites sometimes answer a CI runner with 403, 429 or 503 while the
      # page works for visitors. Those statuses pass, a 404 or 410 fails, so a
      # policy document that moved or disappeared is still caught.
      - name: Link Checker (government sources)
        id: lychee-government
        if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --verbose
            --no-progress
            --max-retries 3
            --accept "100..=103,200..=299,403,429,503"
            --exclude ".*"
            --include "https://www\.tweedekamer\.nl/.*"
            --include "https://zoek\.officielebekendmakingen\.nl/.*"
            --include "https://www\.rijksoverheid\.nl/.*"
            --include "https://www\.digitaleoverheid\.nl/.*"
            --include "https://wetten\.overheid\.nl/.*"
            '**/*.yaml'
            '**/*.md'
            '**/*.ts'
            '**/*.vue'
          output: ./lychee/out-government.md

      # Only create an issue when broken links are found AND running on schedule/manual
      - name: Create Issue (Only on schedule or manual run)
        if: ${{ failure() && steps.lychee.outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken links detected
          content-filepath: ./lychee/out.md
          labels: broken-links

      - name: Create Issue for government sources (Only on schedule or manual run)
        if: ${{ failure() && steps.lychee-government.outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken links to government sources detected
          content-filepath: ./lychee/out-government.md
          labels: broken-links
