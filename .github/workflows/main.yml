name: Website bouwen en uitrollen naar ZAD

# Bij elke push naar main: werk de release-PR bij of breng de release uit, bouw
# de site, zet hem in een nginx-image op GHCR en rol dat image uit op ZAD. Zie
# deploy/README.md.

on:
  push:
    branches:
      - main
  # Handmatig starten kan vanaf elke branch, maar de environment 'productie'
  # laat alleen main toe. Vanaf een andere branch stopt de run bij de uitrol.
  workflow_dispatch:

# Uitrollen op volgorde: een oudere run mag een nieuwere niet inhalen.
concurrency:
  group: deploy-productie
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nederlandsedigitaledienst/nerds
  SITE_URL: https://nerds.digitaledienst.overheid.nl

permissions:
  contents: read

jobs:
  # release-please houdt een release-PR open met de volgende versie en de
  # changelog. Is die PR net gemerged, dan maakt deze job de tag en de
  # GitHub-release. De build wacht hierop, zodat git describe de nieuwe tag
  # ziet en image-tag en versiepagina het releasenummer krijgen.
  release:
    name: Release bijwerken of uitbrengen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Tag en GitHub-release aanmaken, en naar de branch van de release-PR pushen.
      contents: write
      # De release-PR openen en bijwerken.
      pull-requests: write
    steps:
      # De stap en niet de job is voorwaardelijk: een overgeslagen job zou de
      # build en de uitrol die erop wachten ook overslaan.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Site en image bouwen
    needs: release
    # Ook als de release-job faalt: een storing in de release-tooling mag een
    # gewone wijziging niet van de site houden. De run wordt dan wel rood.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Het image gaat naar GHCR.
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: get tag
        id: get_commit_hash
        run: |
          echo "commit_hash=$(git describe --tags)" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      # NERDS_BUILD geeft de hook src/hooks/site_version.py dezelfde waarde als
      # de image-tag hieronder, zodat de pagina 'Huidige versie' en het image
      # niet uiteen kunnen lopen.
      - name: Site bouwen
        env:
          NERDS_BUILD: ${{ steps.get_commit_hash.outputs.commit_hash }}
        run: uv run --locked mkdocs build

      # De image-tag is de uitvoer van git describe. Een nieuwe tag verandert
      # de pod-spec en forceert zo een rollout, wat 'latest' niet doet.
      - name: Image-tag bepalen
        id: image
        env:
          VERSION: ${{ steps.get_commit_hash.outputs.commit_hash }}
        run: echo "image=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Inloggen op GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Image bouwen en pushen
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image }}
        run: |
          docker build -f deploy/Dockerfile -t "${IMAGE_TAG}" .
          docker push "${IMAGE_TAG}"

  deploy:
    name: Uitrollen naar ZAD
    needs: build
    # Expliciet op de build: de standaardvoorwaarde kijkt ook naar de
    # release-job eerder in de keten.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # De deploy-action registreert een GitHub-deployment op de environment.
      deployments: write
    environment:
      name: productie
      url: ${{ env.SITE_URL }}
    steps:
      - id: deploy
        uses: RijksICTGilde/zad-actions/deploy@b612e5968bb88c2c9c05da30f0be2e96b98f78c6  # v4.3.2
        with:
          # API-key van het ZAD-project.
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: ${{ vars.ZAD_PROJECT_ID }}
          deployment-name: productie
          component: website
          image: ${{ needs.build.outputs.image }}
          # Samen het webadres: nerds.digitaledienst.overheid.nl.
          domain-format: subdomain
          subdomain: nerds
          base-domain: digitaledienst.overheid.nl
          wait-for-ready: 'true'
          health-endpoint: /healthz

      # mkdocs bakt site_url in elke canonical, dus het adres moet kloppen.
      - name: URL controleren
        env:
          GEKREGEN: ${{ steps.deploy.outputs.url }}
        run: |
          if [ "${SITE_URL%/}" != "${GEKREGEN%/}" ]; then
            echo "::error::ZAD rolde uit op ${GEKREGEN}, verwacht was ${SITE_URL}"
            exit 1
          fi
