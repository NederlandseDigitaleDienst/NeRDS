# check-site builds the site, which needs the project dependencies and the
# network. pre-commit.ci has neither; the check-site job in CI covers it.
ci:
  skip: [check-site]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Not on the guideline text in skills/: generate_plugin.py writes those
      # files, and a fixer that changes them would undo itself on the next run.
      - id: end-of-file-fixer
        exclude: &generated ^skills/[^/]+/(richtlijn|fases|richtlijnen)\.md$
      - id: trailing-whitespace
        exclude: *generated
      - id: check-yaml
        exclude: mkdocs.yml
      - id: check-json
      - id: check-added-large-files
        # A signed accessibility report is published on purpose, with its screenshots.
        exclude: ^docs/Over-NeRDS/toegankelijkheidsonderzoek-\d{4}-\d{2}-\d{2}\.pdf$
      - id: check-merge-conflict
      - id: check-toml
      - id: detect-private-key
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [--fix]
        # release-please writes the changelog in its own style; the page
        # Versies on the site is a symlink to it.
        # Nor on the guideline text in skills/, see above; its source is linted.
        exclude: ^(CHANGELOG\.md|docs/Over-NeRDS/versies\.md|skills/[^/]+/(richtlijn|fases|richtlijnen)\.md)$
  - repo: local
    hooks:
      # Rewrites the guideline text in skills/ from docs/richtlijnen/. A
      # commit that changes a guideline stops once, with the regenerated
      # files ready to add.
      - id: generate-plugin
        name: Generate the plugin files and the skills from docs/richtlijnen
        entry: python scripts/generate_plugin.py
        language: python
        files: ^(docs/richtlijnen/|docs/action-registry/|skills/|\.plugin/|mkdocs\.yml$|scripts/generate_plugin\.py$|src/hooks/action_registry\.py$)
        pass_filenames: false
        # For the action registry, which the script reads through the site hook.
        additional_dependencies: [pyyaml]
      - id: validate-richtlijnen
        name: Validate NeRDS richtlijn files
        entry: python scripts/validate_richtlijn.py
        # Not `system`: a Mac has no `python` on the PATH, only `python3`.
        language: python
        files: ^docs/richtlijnen/.*/index\.md$
        pass_filenames: false
      - id: validate-actions
        name: Validate actions.yaml registry
        entry: python scripts/validate_actions.py
        language: python
        files: ^docs/action-registry/actions\.yaml$
        pass_filenames: false
        additional_dependencies: [pyyaml, jsonschema]
      - id: check-site
        name: Build the site and check it against the design system
        entry: uv run python scripts/check_site.py
        language: system
        files: ^(docs/|src/|mkdocs\.yml|nldd-design-system\.json|scripts/(check_|behavior_))
        pass_filenames: false
