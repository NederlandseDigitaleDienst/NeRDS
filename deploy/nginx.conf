# Rootless nginx (nginxinc/nginx-unprivileged) serves the static MkDocs build.
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # TLS ends at the ZAD ingress. Relative redirects keep its host name and
    # https instead of leaking the internal port 8080.
    absolute_redirect off;
    port_in_redirect off;

    error_page 404 /404.html;

    # The design system script, its chunks and its stylesheet carry a content
    # hash in their name (src/hooks/nldd_assets.py): a new version is a new
    # name, so a browser may keep them for a year without asking again.
    location ~ ^/assets/nldd/(nldd|chunk)-[A-Za-z0-9]+\.(js|css)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Other names carry no content hash, so they revalidate. The ETag makes
    # that a cheap 304, and a new image never serves stale CSS or JS.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # RFC 9116 puts the file under /.well-known/; some scanners ask the root.
    location = /security.txt {
        return 301 /.well-known/security.txt;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
